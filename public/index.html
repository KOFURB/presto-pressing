<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>NOVA PRESSING</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">

<style>
:root{
  --bg:#e9eef0; --surface:#ffffff; --surface-2:#f4f8f9; --surface-3:#eaf1f2;
  --ink:#132229; --ink-soft:#455860; --muted:#77878e; --line:#dbe4e7; --line-strong:#c4d1d5;
  --accent:#143a70; --accent-2:#0e2b54; --accent-ink:#ffffff; --accent-soft:#dde7f4; --accent-soft-2:#eaf1fa;
  --amber:#b3831e; --amber-soft:#f6ebd2;
  --good:#1c8f5a; --good-soft:#d7efe3;
  --warn:#b9820a; --warn-soft:#f6ead0;
  --crit:#c33b4d; --crit-soft:#f7dde1;
  --info:#2f6f97; --info-soft:#dbe9f2;
  --shadow:0 1px 2px rgba(19,34,41,.06),0 6px 20px -8px rgba(19,34,41,.14);
  --shadow-lg:0 12px 40px -12px rgba(19,34,41,.30);
  --radius:14px; --radius-sm:9px; --radius-lg:20px;
  --sans:'Inter',system-ui,-apple-system,sans-serif;
  --display:'Sora','Inter',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme:dark){
    --bg:#0b1417; --surface:#131f24; --surface-2:#18272d; --surface-3:#1f3138; --line:#25373e; --line-strong:#31474f;
    --ink:#e9f0f2; --ink-soft:#a9bbc1; --muted:#7a8d94;
    --accent:#4f88d8; --accent-2:#6ba0e6; --accent-ink:#ffffff; --accent-soft:#16283f; --accent-soft-2:#0f2036;
    --amber:#d9b45a; --amber-soft:#33291299;
    --good:#3fbd82; --good-soft:#12302279;
    --warn:#e0b24a; --warn-soft:#33290f8a;
    --crit:#ef6d7e; --crit-soft:#3a1b2079;
    --info:#5fa6d1; --info-soft:#12293714;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -10px rgba(0,0,0,.6);
    --shadow-lg:0 16px 50px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0b1417; --surface:#131f24; --surface-2:#18272d; --surface-3:#1f3138; --line:#25373e; --line-strong:#31474f;
  --ink:#e9f0f2; --ink-soft:#a9bbc1; --muted:#7a8d94;
  --accent:#4f88d8; --accent-2:#6ba0e6; --accent-ink:#ffffff; --accent-soft:#16283f; --accent-soft-2:#0f2036;
  --amber:#d9b45a; --amber-soft:#33291299;
  --good:#3fbd82; --good-soft:#12302279;
  --warn:#e0b24a; --warn-soft:#33290f8a;
  --crit:#ef6d7e; --crit-soft:#3a1b2079;
  --info:#5fa6d1; --info-soft:#122937;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -10px rgba(0,0,0,.6);
  --shadow-lg:0 16px 50px -12px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.2;text-wrap:balance}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
a{color:var(--accent)}
.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}

/* ---------- App shell ---------- */
#app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.scrim{position:fixed;inset:0;display:none}
.sidebar{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:20px 18px 16px}
.brand-mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(150deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:var(--accent-ink);flex:none;box-shadow:0 4px 12px -3px color-mix(in srgb,var(--accent) 55%,transparent)}
.brand-mark svg{width:22px;height:22px}
.brand-name{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.02em}
.brand-name small{display:block;font-family:var(--sans);font-weight:500;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:1px}
.nav{padding:6px 12px;display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;color:var(--ink-soft);font-weight:500;font-size:14px;border:none;background:none;width:100%;text-align:left;transition:background .12s,color .12s;position:relative}
.nav-item svg{width:18px;height:18px;flex:none;opacity:.85}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item.active{background:var(--accent-soft);color:var(--accent-2);font-weight:600}
.nav-item.active svg{opacity:1}
.nav-item .badge{margin-left:auto;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px;min-width:20px;text-align:center}
.nav-item.active .badge{background:var(--accent-2)}
.sidebar-foot{margin-top:auto;padding:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}

/* ---------- Topbar ---------- */
.main{display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 26px;background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.page-title{font-size:20px;font-weight:700;letter-spacing:-.02em}
.page-sub{font-size:12.5px;color:var(--muted);margin-top:1px}
.topbar-spacer{flex:1}
.agency-select,.user-chip{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:6px 11px;font-size:13px;font-weight:500;color:var(--ink)}
.agency-select select{border:none;background:none;color:var(--ink);font-weight:600;outline:none;cursor:pointer}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;color:var(--ink-soft)}
.icon-btn:hover{color:var(--accent);border-color:var(--accent-soft)}
.icon-btn svg{width:18px;height:18px}
.user-chip{cursor:pointer}
.user-ava{width:26px;height:26px;border-radius:50%;background:linear-gradient(140deg,var(--accent),var(--accent-2));color:var(--accent-ink);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.user-chip small{color:var(--muted);font-weight:500;font-size:11px;display:block}

/* ---------- Content ---------- */
.view{padding:24px 26px 60px;max-width:1320px;width:100%}
.row{display:flex;gap:14px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:18px}
.section-head{display:flex;align-items:center;gap:12px;margin:6px 0 16px}
.section-head h2{font-size:16px;font-weight:700}
.section-head .page-sub{margin:0}

/* KPI cards */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:17px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kpi-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.kpi-ico svg{width:18px;height:18px}
.kpi-label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.kpi-val{font-family:var(--display);font-size:27px;font-weight:700;letter-spacing:-.02em;margin-top:9px;line-height:1}
.kpi-val small{font-size:15px;font-weight:600;color:var(--ink-soft)}
.kpi-delta{font-size:12px;font-weight:600;margin-top:7px;display:flex;align-items:center;gap:4px}
.kpi-delta.up{color:var(--good)} .kpi-delta.down{color:var(--crit)} .kpi-delta.flat{color:var(--muted)}
.kpi-delta svg{width:14px;height:14px;flex:none}
.pill svg{width:13px;height:13px;flex:none}
.si-lbl svg,.role-note svg{width:15px;height:15px;flex:none}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:13.5px;transition:.12s}
.btn svg{width:16px;height:16px}
.btn:hover{border-color:var(--line-strong);background:var(--surface-2)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn-ghost{background:none;border-color:transparent}
.btn-ghost:hover{background:var(--surface-2)}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn-danger{color:var(--crit);border-color:var(--crit-soft)}
.btn-danger:hover{background:var(--crit-soft)}

/* Table */
.table-wrap{overflow-x:auto;border-radius:var(--radius)}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{transition:background .1s}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl .r{text-align:right}
.cell-strong{font-weight:600;color:var(--ink)}
.cell-sub{font-size:12px;color:var(--muted)}
.avatar{width:32px;height:32px;border-radius:9px;background:var(--accent-soft);color:var(--accent-2);display:grid;place-items:center;font-weight:700;font-size:12.5px;flex:none}
.person{display:flex;align-items:center;gap:10px}

/* Badges / pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.recu{background:var(--info-soft);color:var(--info)}
.pill.cours{background:var(--warn-soft);color:var(--warn)}
.pill.pret{background:var(--good-soft);color:var(--good)}
.pill.livre{background:var(--surface-3);color:var(--ink-soft)}
.pill.paye{background:var(--good-soft);color:var(--good)}
.pill.partiel{background:var(--warn-soft);color:var(--warn)}
.pill.impaye{background:var(--crit-soft);color:var(--crit)}
.pill.actif{background:var(--good-soft);color:var(--good)}
.pill.inactif{background:var(--surface-3);color:var(--muted)}
.pill.low{background:var(--crit-soft);color:var(--crit)}
.pill.ok{background:var(--good-soft);color:var(--good)}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--surface-3);color:var(--ink-soft);font-size:11.5px;font-weight:600}

/* Toolbar / filters */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:230px;flex:1;max-width:360px}
.search input{border:none;background:none;outline:none;color:var(--ink);width:100%}
.search svg{width:16px;height:16px;color:var(--muted);flex:none}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:none;background:none;padding:6px 12px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink-soft)}
.seg button.active{background:var(--surface);color:var(--accent-2);box-shadow:var(--shadow)}
.field-sel{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 11px;color:var(--ink);font-weight:500;outline:none}

/* Forms */
.form-grid{display:grid;gap:14px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:12px;font-weight:600;color:var(--ink-soft)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:9px 11px;color:var(--ink);outline:none;transition:.12s}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
.fld .hint{font-size:11px;color:var(--muted)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(9,18,22,.55);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 18px;overflow-y:auto;opacity:0;pointer-events:none;transition:opacity .15s}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:100%;max-width:640px;transform:translateY(8px) scale(.99);transition:transform .18s;margin:auto}
.modal.wide{max-width:860px}
.modal-overlay.open .modal{transform:none}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:17px;font-weight:700}
.modal-body{padding:22px}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:16px 22px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 var(--radius-lg) var(--radius-lg)}

/* Kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(238px,1fr);gap:14px;overflow-x:auto;padding-bottom:10px}
.kcol{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;min-height:200px}
.kcol-head{display:flex;align-items:center;gap:8px;padding:12px 14px;font-weight:700;font-size:13px;border-bottom:1px solid var(--line)}
.kcol-head .count{margin-left:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;font-size:11px;padding:1px 8px;color:var(--ink-soft)}
.kcol-body{padding:10px;display:flex;flex-direction:column;gap:9px;flex:1}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;box-shadow:var(--shadow);cursor:grab}
.kcard:active{cursor:grabbing}
.kcard.dragging{opacity:.4}
.kcard-num{font-family:var(--mono);font-size:11.5px;color:var(--accent-2);font-weight:600}
.kcard-client{font-weight:600;font-size:13.5px;margin:3px 0 5px}
.kcard-meta{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.kcol.drop-hover{outline:2px dashed var(--accent);outline-offset:-4px}
.stage-dot{width:9px;height:9px;border-radius:50%;flex:none}

/* Receipt */
.receipt{font-family:var(--mono);background:#fff;color:#111;width:320px;margin:0 auto;padding:18px;border-radius:10px;border:1px dashed #bbb}
.receipt *{color:#111 !important}
.receipt h4{font-family:var(--display);text-align:center;font-size:17px}
.receipt .r-line{border-top:1px dashed #999;margin:8px 0}
.receipt table{width:100%;font-size:12px;border-collapse:collapse}
.receipt td{padding:2px 0}
.rc-center{text-align:center}
.qr-box{display:flex;justify-content:center;padding:8px 0}
.qr-box svg,.qr-box img{width:120px;height:120px}

/* misc */
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty svg{width:46px;height:46px;opacity:.4;margin-bottom:10px}
.two-col{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.list-plain{display:flex;flex-direction:column;gap:0}
.list-row{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
.list-row:last-child{border:none}
.progress{height:7px;background:var(--surface-3);border-radius:20px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);border-radius:20px}
.bar-chart{display:flex;align-items:flex-end;gap:10px;height:180px;padding-top:10px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end}
.bar{width:100%;max-width:38px;background:linear-gradient(180deg,var(--accent),var(--accent-2));border-radius:6px 6px 0 0;transition:height .4s;min-height:2px}
.bar.exp{background:linear-gradient(180deg,var(--amber),color-mix(in srgb,var(--amber) 70%,#000))}
.bar-lbl{font-size:11px;color:var(--muted);font-weight:600}
.legend{display:flex;gap:16px;font-size:12px;color:var(--ink-soft);flex-wrap:wrap}
.legend b{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}
.stat-inline{display:flex;gap:22px;flex-wrap:wrap}
.stat-inline .si{display:flex;flex-direction:column;gap:2px}
.si-val{font-family:var(--display);font-weight:700;font-size:19px}
.si-lbl{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.divider{height:1px;background:var(--line);margin:16px 0}
.toast-wrap{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--ink);color:var(--surface);padding:12px 16px;border-radius:11px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:9px;animation:slideIn .25s;max-width:340px}
.toast svg{width:17px;height:17px;flex:none}
.toast.good{background:var(--good)} .toast.err{background:var(--crit)}
@keyframes slideIn{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.items-editor{display:flex;flex-direction:column;gap:8px}
.item-row{display:grid;grid-template-columns:1fr 74px 96px 116px 34px;gap:8px;align-items:center}
.item-row.head{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted);letter-spacing:.04em}
.item-row input,.item-row select{padding:7px 9px}
.mini-x{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;width:32px;height:32px;display:grid;place-items:center;color:var(--crit)}
.money-strong{font-family:var(--display);font-weight:700}
.role-note{font-size:12px;color:var(--muted);background:var(--surface-2);border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
.chip-row{display:flex;gap:7px;flex-wrap:wrap}
.mobile-only{display:none}
.hamb{display:none}

@media (max-width:960px){
  #app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:60;width:250px;transform:translateX(-100%);transition:transform .2s;height:100%}
  .sidebar.open{transform:none}
  .hamb{display:grid}
  .two-col{grid-template-columns:1fr}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55;display:none}
  .scrim.open{display:block}
}
@media (max-width:560px){
  .view{padding:16px 14px 60px}
  .topbar{padding:12px 14px}
  .item-row{grid-template-columns:1fr 54px 80px 90px 30px;gap:6px}
  .agency-select .lbl{display:none}
}
@media print{
  .sidebar,.topbar,.no-print{display:none !important}
  #app{grid-template-columns:1fr}
  .view{padding:0}
  body{background:#fff}
  .print-area,.print-area *{visibility:visible}
}
</style>

<style>
.login-screen{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 25% 15%,var(--accent-soft-2),var(--bg) 55%)}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:32px 30px;width:100%;max-width:400px}
.login-brand{display:flex;align-items:center;gap:12px}
.login-err{color:var(--crit);font-size:13px;font-weight:600;min-height:16px}
.login-card .btn-primary{margin-top:4px}
</style>

</head>
<body>
<div id="loginScreen" class="login-screen"></div>
<div id="app" style="display:none">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10l-1.5 4.2a5 5 0 1 1-7 0Z"/><path d="M9 4V2.5h6V4"/></svg>
      </div>

  setTimeout(()=>{ el.style.transition='opacity .3s,transform .3s'; el.style.opacity='0'; el.style.transform='translateX(30px)'; setTimeout(()=>el.remove(),300); },2600);
}

const NAV = [
  {id:'dashboard',label:'Tableau de bord'},
  {id:'clients',label:'Clients'},
  {id:'commandes',label:'Commandes'},
  {id:'production',label:'Suivi production'},
  {id:'facturation',label:'Facturation'},
  {id:'finances',label:'Finances'},
  {id:'employes',label:'Employés'},
  {id:'utilisateurs',label:'Utilisateurs'},
  {id:'stocks',label:'Stocks'},
  {id:'parametres',label:'Paramètres'}
];
const NAV_GROUPS=[
  {label:'Pilotage',ids:['dashboard']},
  {label:'Exploitation',ids:['clients','commandes','production']},
  {label:'Gestion',ids:['facturation','finances','stocks']},
  {label:'Administration',ids:['employes','utilisateurs','parametres']}
];
let currentView='dashboard';

function allowed(id){ return (DB.access||[]).includes(id); }

function renderNav(){
  const nav=document.getElementById('nav');
  const ordersOngoing = inAgency(DB.orders).filter(o=>o.status==='En cours'||o.status==='Reçu').length;
  const readyCount = inAgency(DB.orders).filter(o=>o.status==='Prêt').length;
  let html='';
  NAV_GROUPS.forEach(g=>{
    const items=g.ids.filter(allowed);
    if(!items.length) return;
    html+=`<div class="nav-label">${g.label}</div>`;
    items.forEach(id=>{
      const n=NAV.find(x=>x.id===id);
      let badge='';
      if(id==='commandes'&&ordersOngoing) badge=`<span class="badge">${ordersOngoing}</span>`;
      if(id==='production'&&readyCount) badge=`<span class="badge">${readyCount}</span>`;
      html+=`<button class="nav-item ${currentView===id?'active':''}" data-nav="${id}">${svg(id)}<span>${n.label}</span>${badge}</button>`;
    });
  });
  nav.innerHTML=html;
  nav.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{ go(b.dataset.nav); document.getElementById('sidebar').classList.remove('open'); document.getElementById('scrim').classList.remove('open'); });
  const ag=DB.agencies.find(a=>a.id===curAgency());
  document.getElementById('sideFoot').innerHTML=`<div style="font-weight:600;color:var(--ink-soft)">${esc(ag.name)}</div><div>${esc(ag.ville)}</div><div style="margin-top:6px">Tél. ${esc(ag.tel)}</div>`;
}

function go(view){
  if(!allowed(view)) view='dashboard';
  currentView=view;
  renderNav();
  const n=NAV.find(x=>x.id===view);
  document.getElementById('pageTitle').textContent=n.label;
  const rendered={dashboard:renderDashboard,clients:renderClients,commandes:renderCommandes,production:renderProduction,facturation:renderFacturation,finances:renderFinances,employes:renderEmployes,utilisateurs:renderUtilisateurs,stocks:renderStocks,parametres:renderParametres};
  (rendered[view]||renderDashboard)();
  document.getElementById('view').scrollTo(0,0);
  window.scrollTo(0,0);
}

function renderDashboard(){
  const orders=inAgency(DB.orders);
  const today=todayISO();
  const ongoing=orders.filter(o=>o.status==='En cours'||o.status==='Reçu');
  const ready=orders.filter(o=>o.status==='Prêt');
  const caToday=orders.filter(o=>o.status==='Livré'&&o.livreAt===today).reduce((s,o)=>s+o.montant,0)
    + orders.filter(o=>o.depotDate===today).reduce((s,o)=>s+o.paye,0);
  const caMonth=orders.filter(o=>o.depotDate.slice(0,7)===today.slice(0,7)).reduce((s,o)=>s+o.montant,0);
  const impayes=orders.reduce((s,o)=>s+orderReste(o),0);
  const clients=inAgency(DB.clients);
  const recentClients=[...clients].sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).slice(0,5);
  const dueToday=orders.filter(o=>o.dueDate<=today && o.status!=='Livré');
  const lowStock=inAgency(DB.stock).filter(s=>s.qty<=s.seuil);

  // 7-day revenue sparkline data
  const days=[]; for(let i=6;i>=0;i--){ const d=addDays(today,-i); days.push({d,val:orders.filter(o=>o.depotDate===d).reduce((s,o)=>s+o.montant,0)}); }
  const maxDay=Math.max(1,...days.map(d=>d.val));

  const kpi=(ico,cls,label,val,delta)=>`<div class="kpi"><div class="kpi-top"><span class="kpi-label">${label}</span>
    <span class="kpi-ico" style="background:${cls}22;color:${cls}">${svg(ico)}</span></div>
    <div class="kpi-val">${val}</div>${delta||''}</div>`;

  document.getElementById('view').innerHTML=`
  <div class="kpis" style="margin-bottom:18px">
    ${kpi('clock','var(--warn)','Commandes en cours',ongoing.length, `<div class="kpi-delta flat">${svg('commandes')} ${ongoing.length} à traiter</div>`)}
    ${kpi('check','var(--good)','Commandes prêtes',ready.length,`<div class="kpi-delta up">Prêtes à livrer</div>`)}
    ${kpi('money','var(--accent)','Chiffre d’affaires du jour','<span class="tnum">'+FCFA(caToday)+'</span>',`<div class="kpi-delta flat">Mois : ${FCFA(caMonth)}</div>`)}
    ${kpi('alert','var(--crit)','Reste à encaisser','<span class="tnum">'+FCFA(impayes)+'</span>',`<div class="kpi-delta ${impayes>0?'down':'flat'}">${orders.filter(o=>orderReste(o)>0).length} commande(s)</div>`)}
  </div>

  <div class="two-col">
    <div class="card card-pad">
      <div class="section-head"><h2>Recette des 7 derniers jours</h2><div class="topbar-spacer"></div><span class="tag">${DB.agencies.find(a=>a.id===curAgency()).name}</span></div>
      <div class="bar-chart">
        ${days.map(d=>`<div class="bar-col"><div class="bar" style="height:${Math.max(2,d.val/maxDay*100)}%" title="${FCFA(d.val)}"></div><div class="bar-lbl">${fdate(d.d).slice(0,5)}</div></div>`).join('')}
      </div>
      <div class="divider"></div>
      <div class="stat-inline">
        <div class="si"><span class="si-val tnum">${FCFA(days.reduce((s,d)=>s+d.val,0))}</span><span class="si-lbl">Total 7 jours</span></div>
        <div class="si"><span class="si-val tnum">${orders.length}</span><span class="si-lbl">Commandes totales</span></div>
        <div class="si"><span class="si-val tnum">${clients.length}</span><span class="si-lbl">Clients actifs</span></div>
      </div>
    </div>

    <div class="card card-pad">
      <div class="section-head"><h2>À livrer / en retard</h2></div>
      ${dueToday.length? `<div class="list-plain">${dueToday.slice(0,5).map(o=>`
        <div class="list-row">
          <span class="stage-dot" style="background:${o.dueDate<today?'var(--crit)':'var(--warn)'}"></span>
          <div style="flex:1"><div class="cell-strong">${esc(clientName(o.clientId))}</div><div class="cell-sub mono">${o.num} · ${o.items.reduce((s,i)=>s+i.qty,0)} art.</div></div>
          <div style="text-align:right"><span class="pill ${STATUS_CLASS[o.status]}"><span class="dot"></span>${o.status}</span><div class="cell-sub" style="margin-top:3px">${o.dueDate<today?'Retard':'Échéance'} ${fdate(o.dueDate)}</div></div>
        </div>`).join('')}</div>` : `<div class="empty">${svg('check')}<div>Aucune commande en retard 🎉</div></div>`}
    </div>
  </div>

  <div class="two-col" style="margin-top:16px">
    <div class="card card-pad">
      <div class="section-head"><h2>Clients récents</h2><div class="topbar-spacer"></div><button class="btn btn-sm btn-ghost" onclick="go('clients')">Voir tout</button></div>
      <div class="table-wrap"><table class="tbl"><thead><tr><th>Client</th><th>Téléphone</th><th class="r">Points</th><th class="r">Depuis</th></tr></thead><tbody>
        ${recentClients.map(c=>`<tr><td><div class="person"><div class="avatar">${initials(c.prenom,c.nom)}</div><div><div class="cell-strong">${esc(c.prenom)} ${esc(c.nom)}</div><div class="cell-sub">${esc(c.adresse||'')}</div></div></div></td>
          <td class="mono">${esc(c.tel)}</td><td class="r"><span class="pill paye">${svg('star')} ${c.points}</span></td><td class="r cell-sub">${fdate(c.createdAt)}</td></tr>`).join('')}
      </tbody></table></div>
    </div>

    <div class="card card-pad">
      <div class="section-head"><h2>Alertes stock</h2><div class="topbar-spacer"></div><button class="btn btn-sm btn-ghost" onclick="go('stocks')">Gérer</button></div>
      ${lowStock.length? `<div class="list-plain">${lowStock.map(s=>`
        <div class="list-row"><span class="kpi-ico" style="background:var(--crit-soft);color:var(--crit);width:30px;height:30px">${svg('box')}</span>
          <div style="flex:1"><div class="cell-strong">${esc(s.nom)}</div><div class="cell-sub">${esc(s.categorie)}</div></div>
          <span class="pill low">${s.qty} ${esc(s.unite)} · sous seuil</span></div>`).join('')}</div>`
        : `<div class="empty">${svg('box')}<div>Stock au-dessus des seuils</div></div>`}
    </div>
  </div>`;
  document.getElementById('pageSub').textContent = new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}

window.saveClient=async function(id){
  const g=x=>document.getElementById(x).value.trim();
  if(!g('f_prenom')||!g('f_nom')||!g('f_tel')){ toast('Prénom, nom et téléphone requis','err'); return; }
  const payload={agencyId:curAgency(),prenom:g('f_prenom'),nom:g('f_nom'),tel:g('f_tel'),email:g('f_email'),adresse:g('f_adresse')};
  try{
    if(id){ payload.points=parseInt(document.getElementById('f_points').value)||0; const c=await API.put('/clients/'+id,payload); replaceIn(DB.clients,c); toast('Client mis à jour','good'); }
    else{ const c=await API.post('/clients',payload); DB.clients.push(c); toast('Client créé','good'); }
    closeModal(); renderClients();
  }catch(e){ toast(e.message,'err'); }
};

  orders=[...orders].sort((a,b)=>b.depotDate.localeCompare(a.depotDate)||b.num.localeCompare(a.num));
  const counts={all:inAgency(DB.orders).length}; STATUSES.forEach(s=>counts[s]=inAgency(DB.orders).filter(o=>o.status===s).length);
  document.getElementById('pageSub').textContent=`${inAgency(DB.orders).length} commandes`;
  document.getElementById('view').innerHTML=`
  <div class="toolbar">
    <div class="seg">
      <button class="${orderFilter==='all'?'active':''}" onclick="setOF('all')">Toutes (${counts.all})</button>

        <td><div class="cell-strong">${esc(clientName(o.clientId))}</div></td>
        <td>${o.items.reduce((s,i)=>s+i.qty,0)} art. <span class="cell-sub">(${o.items.length} type${o.items.length>1?'s':''})</span></td>
        <td>${fdate(o.depotDate)}</td>
        <td class="${late?'':''}" ${late?'style="color:var(--crit);font-weight:600"':''}>${fdate(o.dueDate)}${late?' ⚠':''}</td>

        <td class="r money-strong tnum">${FCFA(o.montant)}${orderReste(o)>0?`<div class="cell-sub">Reste ${FCFA(orderReste(o))}</div>`:''}</td>
        <td class="r"><div style="display:inline-flex;gap:5px">
          <button class="btn btn-sm" onclick="viewReceipt('${o.id}')" title="Reçu">${svg('receipt')}</button>
          <button class="btn btn-sm btn-ghost" onclick="orderForm('${o.id}')" title="Modifier">${svg('edit')}</button>
        </div></td></tr>`;}).join('')
      :`<tr><td colspan="9"><div class="empty">${svg('commandes')}<div>Aucune commande</div></div></td></tr>`}
    </tbody></table></div></div>`;
  const s=document.getElementById('oSearch');

window.setOF=v=>{ orderFilter=v; renderCommandes(); };

window.addItemRow=()=>{ window._items.push({type:'Pantalon',qty:1,etat:'Normal',prixUnit:priceOf('Pantalon')}); renderItemRows(); };
window.removeItem=i=>{ window._items.splice(i,1); renderItemRows(); };
window.itemChange=(i,k,v)=>{ if(k==='qty'||k==='prixUnit') v=parseInt(v)||0; if(k==='type') window._items[i].prixUnit=priceOf(v); window._items[i][k]=v; if(k==='type')renderItemRows(); else recalcOrder(); };
window.recalcOrder=()=>{ const brut=window._items.reduce((s,it)=>s+it.qty*it.prixUnit,0); const rem=parseInt(document.getElementById('o_remise').value)||0; document.getElementById('o_total').textContent=FCFA(Math.max(0,brut-rem)); };
window.saveOrder=async function(id){
  const g=x=>document.getElementById(x).value;
  const items=window._items.filter(it=>it.qty>0);
  if(!items.length){ toast('Ajoutez au moins un article','err'); return; }
  const remise=parseInt(g('o_remise'))||0;
  const brut=items.reduce((s,it)=>s+it.qty*it.prixUnit,0);
  const montant=Math.max(0,brut-remise);
  const payload={clientId:g('o_client'),agencyId:curAgency(),depotDate:g('o_depot'),dueDate:g('o_due'),status:g('o_status'),prodStage:g('o_stage'),remise,paye:parseInt(g('o_paye'))||0,notes:g('o_notes'),items};
  try{
    let order;
    if(id){ order=await API.put('/orders/'+id,payload); replaceIn(DB.orders,order); toast('Commande mise à jour','good'); }
    else{
      order=await API.post('/orders',payload); DB.orders.push(order);
      const c=clientById(order.clientId); if(c){ c.points += Math.floor(montant/(DB.settings.loyaltyRate||1000)); }
      toast('Commande '+order.num+' créée','good');
    }
    closeModal();
    if(currentView==='commandes')renderCommandes(); else if(currentView==='production')renderProduction(); else renderDashboard();
    renderNav();
    if(!id) viewReceipt(order.id);
  }catch(e){ toast(e.message,'err'); }
};

function drawQR(containerId,text){
  const box=document.getElementById(containerId); if(!box) return;
  try{
    const qr=qrcode(0,'M'); qr.addData(text); qr.make();
    box.innerHTML=qr.createSvgTag({cellSize:4,margin:0,scalable:true});
    const s=box.querySelector('svg'); if(s){ s.style.width='120px'; s.style.height='120px'; s.querySelectorAll('*').forEach(p=>{ if(p.getAttribute('fill')==='#000000'||p.tagName==='rect'&&!p.getAttribute('fill')) {} }); }
  }catch(e){ box.innerHTML='<div style="font-size:10px">'+esc(text)+'</div>'; }
}

  let msg='';
  if(kind==='pret'){ const o=DB.orders.find(x=>x.id===orderId); msg=`Bonjour ${c.prenom}, votre commande ${o?o.num:''} chez ${ag.name} est prête ✅. Montant restant : ${FCFA(orderId?orderReste(o):0)}. Merci !`; }

/* ============ PRODUCTION (Kanban) ============ */
function renderProduction(){
  const orders=inAgency(DB.orders).filter(o=>o.status!=='Livré' || o.prodStage!=='Livré');
  document.getElementById('pageSub').textContent='Glissez les commandes entre les étapes du processus';
  const byStage={}; STAGES.forEach(s=>byStage[s]=[]);
  inAgency(DB.orders).forEach(o=>{ (byStage[o.prodStage]||byStage['Réception']).push(o); });
  document.getElementById('view').innerHTML=`
  <div class="toolbar"><div class="chip-row">${STAGES.map(s=>`<span class="tag" style="border-left:3px solid ${STAGE_COLOR[s]}">${s} · ${byStage[s].length}</span>`).join('')}</div></div>
  <div class="kanban">${STAGES.map(stage=>`
    <div class="kcol" data-stage="${stage}">
      <div class="kcol-head"><span class="stage-dot" style="background:${STAGE_COLOR[stage]}"></span>${stage}<span class="count">${byStage[stage].length}</span></div>
      <div class="kcol-body" data-drop="${stage}">
        ${byStage[stage].sort((a,b)=>a.dueDate.localeCompare(b.dueDate)).map(o=>{
          const late=o.dueDate<todayISO()&&stage!=='Livré';
          return `<div class="kcard" draggable="true" data-oid="${o.id}">
            <div class="kcard-num">${o.num}</div>
            <div class="kcard-client">${esc(clientName(o.clientId))}</div>
            <div class="kcard-meta"><span>${o.items.reduce((s,i)=>s+i.qty,0)} art.</span><span style="${late?'color:var(--crit);font-weight:600':''}">${fdate(o.dueDate)}${late?' ⚠':''}</span></div>
          </div>`;}).join('')}
      </div>
    </div>`).join('')}</div>`;
  wireKanban();
}
function wireKanban(){
  let dragId=null;
  document.querySelectorAll('.kcard').forEach(card=>{
    card.addEventListener('dragstart',e=>{ dragId=card.dataset.oid; card.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; });
    card.addEventListener('dragend',()=>{ card.classList.remove('dragging'); document.querySelectorAll('.kcol').forEach(c=>c.classList.remove('drop-hover')); });
    card.addEventListener('click',()=>orderForm(card.dataset.oid));
  });
  document.querySelectorAll('.kcol-body').forEach(col=>{
    col.addEventListener('dragover',e=>{ e.preventDefault(); col.closest('.kcol').classList.add('drop-hover'); });
    col.addEventListener('dragleave',()=>col.closest('.kcol').classList.remove('drop-hover'));
    col.addEventListener('drop',async e=>{
      e.preventDefault();
      const stage=col.dataset.drop; const o=DB.orders.find(x=>x.id===dragId); if(!o)return;
      if(o.prodStage===stage) return;
      try{ const upd=await API.patch('/orders/'+o.id+'/stage',{prodStage:stage}); replaceIn(DB.orders,upd); renderProduction(); renderNav(); toast(upd.num+' → '+stage,'good'); }
      catch(err){ toast(err.message,'err'); renderProduction(); }
    });
  });
}

function renderFinances(){
  const orders=inAgency(DB.orders); const expenses=inAgency(DB.expenses);
  const month=todayISO().slice(0,7);
  const recettesMois=orders.filter(o=>o.depotDate.slice(0,7)===month).reduce((s,o)=>s+o.montant,0);
  const depensesMois=expenses.filter(e=>e.date.slice(0,7)===month).reduce((s,e)=>s+e.montant,0);
  const benefMois=recettesMois-depensesMois;
  const recettesAn=orders.filter(o=>o.depotDate.slice(0,4)===month.slice(0,4)).reduce((s,o)=>s+o.montant,0);
  const depensesAn=expenses.filter(e=>e.date.slice(0,4)===month.slice(0,4)).reduce((s,e)=>s+e.montant,0);
  // last 6 months chart
  const months=[]; for(let i=5;i>=0;i--){ const d=new Date(); d.setMonth(d.getMonth()-i); const key=d.toISOString().slice(0,7);
    months.push({key,label:d.toLocaleDateString('fr-FR',{month:'short'}),
      rec:orders.filter(o=>o.depotDate.slice(0,7)===key).reduce((s,o)=>s+o.montant,0),
      dep:expenses.filter(e=>e.date.slice(0,7)===key).reduce((s,e)=>s+e.montant,0)}); }
  const maxM=Math.max(1,...months.map(m=>Math.max(m.rec,m.dep)));
  const recentExp=[...expenses].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);
  document.getElementById('pageSub').textContent='Recettes, dépenses, bénéfices et rapports';
  document.getElementById('view').innerHTML=`
  <div class="kpis" style="margin-bottom:18px">
    <div class="kpi"><div class="kpi-top"><span class="kpi-label">Recettes du mois</span><span class="kpi-ico" style="background:var(--good-soft);color:var(--good)">${svg('money')}</span></div><div class="kpi-val tnum">${FCFA(recettesMois)}</div></div>
    <div class="kpi"><div class="kpi-top"><span class="kpi-label">Dépenses du mois</span><span class="kpi-ico" style="background:var(--amber-soft);color:var(--amber)">${svg('finances')}</span></div><div class="kpi-val tnum">${FCFA(depensesMois)}</div></div>
    <div class="kpi"><div class="kpi-top"><span class="kpi-label">Bénéfice du mois</span><span class="kpi-ico" style="background:${benefMois>=0?'var(--good-soft)':'var(--crit-soft)'};color:${benefMois>=0?'var(--good)':'var(--crit)'}">${svg('finances')}</span></div><div class="kpi-val tnum" style="color:${benefMois>=0?'var(--good)':'var(--crit)'}">${FCFA(benefMois)}</div></div>
    <div class="kpi"><div class="kpi-top"><span class="kpi-label">Bénéfice annuel</span><span class="kpi-ico" style="background:var(--accent-soft);color:var(--accent)">${svg('finances')}</span></div><div class="kpi-val tnum">${FCFA(recettesAn-depensesAn)}</div><div class="kpi-delta flat">Rec. ${FCFA(recettesAn)}</div></div>
  </div>
  <div class="two-col">
    <div class="card card-pad">
      <div class="section-head"><h2>Recettes vs Dépenses — 6 mois</h2><div class="topbar-spacer"></div>
        <div class="legend"><span><b style="background:var(--accent)"></b>Recettes</span><span><b style="background:var(--amber)"></b>Dépenses</span></div></div>
      <div class="bar-chart">${months.map(m=>`<div class="bar-col" style="flex-direction:row;align-items:flex-end;gap:4px">
        <div class="bar" style="height:${m.rec/maxM*100}%" title="Recettes ${FCFA(m.rec)}"></div>
        <div class="bar exp" style="height:${m.dep/maxM*100}%" title="Dépenses ${FCFA(m.dep)}"></div>
      </div>`).join('')}</div>
      <div class="bar-chart" style="height:auto;padding:6px 0 0">${months.map(m=>`<div class="bar-col" style="height:auto"><div class="bar-lbl">${m.label}</div></div>`).join('')}</div>
      <div class="divider"></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-sm" onclick="printReport('mois')">${svg('print')} Rapport mensuel (PDF)</button>
        <button class="btn btn-sm" onclick="printReport('an')">${svg('print')} Rapport annuel (PDF)</button>
        <button class="btn btn-sm" onclick="exportCSV()">${svg('download')} Export Excel (CSV)</button>
      </div>
    </div>
    <div class="card card-pad">
      <div class="section-head"><h2>Dépenses récentes</h2><div class="topbar-spacer"></div>${allowed('finances')?`<button class="btn btn-sm btn-primary" onclick="expenseForm()">${svg('plus')} Dépense</button>`:''}</div>
      <div class="table-wrap"><table class="tbl"><thead><tr><th>Date</th><th>Catégorie</th><th class="r">Montant</th></tr></thead>
      <tbody>${recentExp.length?recentExp.map(e=>`<tr><td>${fdate(e.date)}</td><td><span class="tag">${esc(e.categorie)}</span></td><td class="r money-strong tnum">${FCFA(e.montant)}</td></tr>`).join(''):`<tr><td colspan="3"><div class="empty">${svg('finances')}<div>Aucune dépense</div></div></td></tr>`}</tbody></table></div>
    </div>
  </div>`;
}

    .box{display:flex;gap:14px;margin-top:16px}.b{flex:1;background:#f4f8f9;border-radius:8px;padding:14px}
    .b .v{font-size:20px;font-weight:800;color:#0c7d86}.b .l{font-size:11px;color:#777;text-transform:uppercase}
  </style></head><body>
    <h1>${esc(ag.name)}</h1><div class="sub">${esc(ag.ville)} · ${title}</div>
    <div class="box">
      <div class="b"><div class="v">${FCFA(rec)}</div><div class="l">Recettes (facturé)</div></div>
      <div class="b"><div class="v">${FCFA(dep)}</div><div class="l">Dépenses</div></div>
      <div class="b"><div class="v" style="color:${rec-dep>=0?'#1c8f5a':'#c33b4d'}">${FCFA(rec-dep)}</div><div class="l">Bénéfice</div></div>
    </div>
    <h2>Indicateurs</h2>
    <table><tr><td>Nombre de commandes</td><td class="r">${fO.length}</td></tr>
      <tr><td>Montant encaissé</td><td class="r">${FCFA(enc)}</td></tr>
      <tr><td>Reste à encaisser</td><td class="r">${FCFA(rec-enc)}</td></tr>

    <h2>Dépenses par catégorie</h2>
    <table><thead><tr><th>Catégorie</th><th class="r">Montant</th></tr></thead><tbody>

    </tbody></table>

  </body></html>`);
  w.document.close(); setTimeout(()=>w.print(),400);
};
window.exportCSV=function(){
  const orders=inAgency(DB.orders);

    const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});

    a.href=url; a.download='commandes_presto.csv'; document.body.appendChild(a); a.click(); a.remove();
    toast('Export CSV téléchargé','good');

};

  <div class="modal-foot">${id?`<button class="btn btn-danger" onclick="delEmp('${id}')">${svg('trash')} Supprimer</button>`:''}<div class="topbar-spacer"></div><button class="btn btn-ghost" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="saveEmp('${id||''}')">${svg('check')} Enregistrer</button></div>`);
};
window.saveEmp=async function(id){
  const g=x=>document.getElementById(x).value.trim();
  if(!g('em_prenom')||!g('em_nom')){ toast('Prénom et nom requis','err'); return; }
  const data={agencyId:curAgency(),matricule:g('em_mat'),poste:g('em_poste'),prenom:g('em_prenom'),nom:g('em_nom'),tel:g('em_tel'),embauche:document.getElementById('em_emb').value,adresse:g('em_adr'),salaire:parseInt(g('em_sal'))||0,statut:document.getElementById('em_stat').value};
  try{
    if(id){ const e=await API.put('/employees/'+id,data); replaceIn(DB.employees,e); }
    else{ const e=await API.post('/employees',data); DB.employees.push(e); }
    closeModal(); renderEmployes(); toast('Employé enregistré','good');
  }catch(err){ toast(err.message,'err'); }
};
window.delEmp=async function(id){ try{ await API.del('/employees/'+id); removeIn(DB.employees,id); closeModal(); renderEmployes(); toast('Employé supprimé'); }catch(e){ toast(e.message,'err'); } };

/* ============ UTILISATEURS ============ */
function renderUtilisateurs(){
  document.getElementById('pageSub').textContent='Comptes et rôles d\'accès';
  document.getElementById('view').innerHTML=`
  <div class="card card-pad" style="margin-bottom:16px">
    <div class="section-head"><h2>Rôles & permissions</h2></div>
    <div class="table-wrap"><table class="tbl"><thead><tr><th>Rôle</th><th>Modules accessibles</th></tr></thead>
    <tbody>${ROLES.map(r=>`<tr><td class="cell-strong">${esc(r)}</td><td><div class="chip-row">${ROLE_ACCESS[r].map(m=>`<span class="tag">${NAV.find(n=>n.id===m).label}</span>`).join('')}</div></td></tr>`).join('')}</tbody></table></div>
  </div>
  <div class="toolbar"><div class="topbar-spacer"></div><button class="btn btn-primary" onclick="userForm()">${svg('plus')} Nouvel utilisateur</button></div>
  <div class="card"><div class="table-wrap"><table class="tbl">
    <thead><tr><th>Utilisateur</th><th>Identifiant</th><th>Rôle</th><th>Statut</th><th class="r">Actions</th></tr></thead>
    <tbody>${DB.users.map(u=>`<tr>
      <td><div class="person"><div class="avatar">${initials(...u.nom.split(' '))}</div><div class="cell-strong">${esc(u.nom)}</div></div></td>
      <td class="mono">${esc(u.login)}</td><td><span class="tag">${esc(u.role)}</span></td>
      <td><span class="pill ${u.actif?'actif':'inactif'}"><span class="dot"></span>${u.actif?'Actif':'Désactivé'}</span></td>
      <td class="r"><button class="btn btn-sm btn-ghost" onclick="userForm('${u.id}')">${svg('edit')}</button></td></tr>`).join('')}</tbody></table></div></div>`;
}
window.userForm=function(id){
  const u=id?DB.users.find(x=>x.id===id):{nom:'',login:'',role:'Caissier',actif:true};
  openModal(`<div class="modal-head"><h3>${id?'Modifier utilisateur':'Nouvel utilisateur'}</h3><button class="icon-btn btn-ghost" onclick="closeModal()">${svg('x')}</button></div>
  <div class="modal-body"><div class="form-grid" style="grid-template-columns:1fr 1fr">
    <div class="fld" style="grid-column:1/-1"><label>Nom complet *</label><input id="u_nom" value="${esc(u.nom)}"></div>
    <div class="fld"><label>Identifiant</label><input id="u_login" value="${esc(u.login)}"></div>
    <div class="fld"><label>Rôle</label><select id="u_role">${ROLES.map(r=>`<option ${r===u.role?'selected':''}>${r}</option>`).join('')}</select></div>
    <div class="fld"><label>Statut</label><select id="u_actif"><option value="1" ${u.actif?'selected':''}>Actif</option><option value="0" ${!u.actif?'selected':''}>Désactivé</option></select></div>
    <div class="fld" style="grid-column:1/-1"><label>Mot de passe ${id?'(laisser vide pour ne pas changer)':'*'}</label><input id="u_pass" type="password" autocomplete="new-password" placeholder="${id?'••••••••':'Mot de passe initial'}"></div>
  </div></div>
  <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="saveUser('${id||''}')">${svg('check')} Enregistrer</button></div>`);
};
window.saveUser=async function(id){
  const g=x=>document.getElementById(x).value.trim();
  if(!g('u_nom')){ toast('Nom requis','err'); return; }
  const pass=document.getElementById('u_pass').value;
  if(!id && !pass){ toast('Mot de passe requis pour un nouvel utilisateur','err'); return; }
  const data={nom:g('u_nom'),login:g('u_login')||g('u_nom').toLowerCase().replace(/\s+/g,'.'),role:document.getElementById('u_role').value,actif:document.getElementById('u_actif').value==='1'};
  if(pass) data.password=pass;
  try{
    if(id){ const u=await API.put('/users/'+id,data); replaceIn(DB.users,u); }
    else{ const u=await API.post('/users',data); DB.users.push(u); }
    closeModal(); renderUtilisateurs(); renderTopbar(); toast('Utilisateur enregistré','good');
  }catch(e){ toast(e.message,'err'); }
};

/* ============ STOCKS ============ */
function renderStocks(){
  const stock=inAgency(DB.stock);
  const low=stock.filter(s=>s.qty<=s.seuil);
  document.getElementById('pageSub').textContent=`${stock.length} références · ${low.length} sous seuil`;
  document.getElementById('view').innerHTML=`
  ${low.length?`<div class="role-note" style="border-color:var(--crit-soft);color:var(--crit);background:var(--crit-soft);margin-bottom:16px;display:flex;align-items:center;gap:8px">${svg('alert')} <span><b>${low.length} article(s)</b> sous le seuil d'alerte : ${low.map(s=>esc(s.nom)).join(', ')}</span></div>`:''}
  <div class="toolbar"><div class="topbar-spacer"></div><button class="btn btn-primary" onclick="stockForm()">${svg('plus')} Nouvel article</button></div>
  <div class="card"><div class="table-wrap"><table class="tbl">
    <thead><tr><th>Article</th><th>Catégorie</th><th class="r">Quantité</th><th class="r">Seuil</th><th>Niveau</th><th class="r">Actions</th></tr></thead>
    <tbody>${stock.length?stock.map(s=>{ const pct=Math.min(100,Math.round(s.qty/(s.seuil*2)*100)); const lowS=s.qty<=s.seuil; return `<tr>
      <td class="cell-strong">${esc(s.nom)}</td><td><span class="tag">${esc(s.categorie)}</span></td>
      <td class="r tnum">${s.qty} <span class="cell-sub">${esc(s.unite)}</span></td><td class="r tnum">${s.seuil}</td>
      <td style="min-width:130px"><div class="progress"><span style="width:${pct}%;background:${lowS?'var(--crit)':'var(--accent)'}"></span></div><div style="margin-top:4px"><span class="pill ${lowS?'low':'ok'}">${lowS?'À réapprovisionner':'OK'}</span></div></td>
      <td class="r"><div style="display:inline-flex;gap:5px">
        <button class="btn btn-sm" onclick="stockAdjust('${s.id}',1)">+</button>
        <button class="btn btn-sm" onclick="stockAdjust('${s.id}',-1)">−</button>
        <button class="btn btn-sm btn-ghost" onclick="stockForm('${s.id}')">${svg('edit')}</button>
      </div></td></tr>`;}).join(''):`<tr><td colspan="6"><div class="empty">${svg('stocks')}<div>Aucun article en stock</div></div></td></tr>`}
    </tbody></table></div></div>`;
}
window.stockAdjust=async function(id,d){ try{ const s=await API.patch('/stock/'+id+'/adjust',{delta:d}); replaceIn(DB.stock,s); renderStocks(); }catch(e){ toast(e.message,'err'); } };
window.stockForm=function(id){
  const s=id?DB.stock.find(x=>x.id===id):{nom:'',categorie:'Lessive',qty:0,seuil:5,unite:'pièce'};
  const cats=['Lessive','Cintres','Emballages','Produits','Autre'];
  openModal(`<div class="modal-head"><h3>${id?'Modifier article':'Nouvel article'}</h3><button class="icon-btn btn-ghost" onclick="closeModal()">${svg('x')}</button></div>
  <div class="modal-body"><div class="form-grid" style="grid-template-columns:1fr 1fr">
    <div class="fld" style="grid-column:1/-1"><label>Nom de l'article *</label><input id="s_nom" value="${esc(s.nom)}"></div>
    <div class="fld"><label>Catégorie</label><select id="s_cat">${cats.map(c=>`<option ${c===s.categorie?'selected':''}>${c}</option>`).join('')}</select></div>
    <div class="fld"><label>Unité</label><input id="s_unite" value="${esc(s.unite)}"></div>
    <div class="fld"><label>Quantité</label><input type="number" id="s_qty" value="${s.qty}"></div>
    <div class="fld"><label>Seuil d'alerte</label><input type="number" id="s_seuil" value="${s.seuil}"></div>
  </div></div>
  <div class="modal-foot">${id?`<button class="btn btn-danger" onclick="delStock('${id}')">${svg('trash')} Supprimer</button>`:''}<div class="topbar-spacer"></div><button class="btn btn-ghost" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="saveStock('${id||''}')">${svg('check')} Enregistrer</button></div>`);
};
window.saveStock=async function(id){
  const g=x=>document.getElementById(x).value;
  if(!g('s_nom').trim()){ toast('Nom requis','err'); return; }
  const data={agencyId:curAgency(),nom:g('s_nom'),categorie:g('s_cat'),unite:g('s_unite'),qty:parseInt(g('s_qty'))||0,seuil:parseInt(g('s_seuil'))||0};
  try{
    if(id){ const s=await API.put('/stock/'+id,data); replaceIn(DB.stock,s); }
    else{ const s=await API.post('/stock',data); DB.stock.push(s); }
    closeModal(); renderStocks(); toast('Stock mis à jour','good');
  }catch(e){ toast(e.message,'err'); }
};
window.delStock=async function(id){ try{ await API.del('/stock/'+id); removeIn(DB.stock,id); closeModal(); renderStocks(); toast('Article supprimé'); }catch(e){ toast(e.message,'err'); } };

/* ============ PARAMETRES ============ */
function renderParametres(){
  document.getElementById('pageSub').textContent='Configuration, agences et tarifs';
  document.getElementById('view').innerHTML=`
  <div class="two-col">
    <div class="card card-pad">
      <div class="section-head"><h2>Grille tarifaire</h2></div>
      <div class="table-wrap"><table class="tbl"><thead><tr><th>Article</th><th class="r">Prix (F)</th><th></th></tr></thead>
      <tbody>${DB.tarifs.map((t,i)=>`<tr><td>${esc(t.type)}</td><td class="r"><input type="number" value="${t.prix}" data-ttype="${esc(t.type)}" style="width:100px;text-align:right;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:5px 8px;color:var(--ink)" onchange="setTarif(this.dataset.ttype,this.value)"></td><td class="r"></td></tr>`).join('')}</tbody></table></div>
    </div>
    <div>
      <div class="card card-pad" style="margin-bottom:16px">
        <div class="section-head"><h2>Agences</h2></div>
        <div class="list-plain">${DB.agencies.map(a=>`<div class="list-row"><span class="kpi-ico" style="background:var(--accent-soft);color:var(--accent);width:32px;height:32px">${svg('parametres')}</span><div style="flex:1"><div class="cell-strong">${esc(a.name)}</div><div class="cell-sub">${esc(a.ville)} · ${esc(a.tel)}</div></div><button class="btn btn-sm btn-ghost" onclick="agencyForm('${a.id}')">${svg('edit')}</button></div>`).join('')}</div>
        <button class="btn btn-sm btn-ghost" style="margin-top:10px" onclick="agencyForm()">${svg('plus')} Ajouter une agence</button>
      </div>
      <div class="card card-pad">
        <div class="section-head"><h2>Fidélité & notifications</h2></div>
        <div class="fld" style="margin-bottom:12px"><label>1 point de fidélité tous les (F dépensés)</label><input type="number" id="p_loyal" value="${DB.settings.loyaltyRate}"></div>
        <div class="fld" style="margin-bottom:12px"><label>Fournisseur SMS</label><input id="p_sms" value="${esc(DB.settings.smsProvider)}"></div>
        <button class="btn btn-primary btn-sm" onclick="saveSettings()">${svg('check')} Enregistrer les paramètres</button>
      </div>
      <div class="card card-pad" style="margin-top:16px">
        <div class="section-head"><h2>Données</h2></div>
        <p class="page-sub" style="margin-bottom:12px">Les données sont enregistrées sur le serveur (base MySQL), partagées entre tous les postes.</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-sm" onclick="exportCSV()">${svg('download')} Exporter les commandes</button>
        </div>
      </div>
    </div>
  </div>`;
}
window.setTarif=async function(type,v){ const prix=parseInt(v)||0; try{ await API.put('/tarifs',{type,prix}); const t=DB.tarifs.find(x=>x.type===type); if(t)t.prix=prix; toast('Tarif mis à jour','good'); }catch(e){ toast(e.message,'err'); } };
window.saveSettings=async function(){ const loyaltyRate=parseInt(document.getElementById('p_loyal').value)||1000; const smsProvider=document.getElementById('p_sms').value; try{ await API.put('/settings',{loyaltyRate,smsProvider}); DB.settings.loyaltyRate=loyaltyRate; DB.settings.smsProvider=smsProvider; toast('Paramètres enregistrés','good'); }catch(e){ toast(e.message,'err'); } };
window.agencyForm=function(id){
  const a=id?DB.agencies.find(x=>x.id===id):{name:'',ville:'',tel:''};
  openModal(`<div class="modal-head"><h3>${id?'Modifier l\'agence':'Nouvelle agence'}</h3><button class="icon-btn btn-ghost" onclick="closeModal()">${svg('x')}</button></div>
  <div class="modal-body"><div class="form-grid">
    <div class="fld"><label>Nom (affiché sur les reçus) *</label><input id="a_name" value="${esc(a.name)}" placeholder="NOVA PRESSING — Cocody"></div>
    <div class="fld"><label>Adresse</label><input id="a_ville" value="${esc(a.ville)}" placeholder="Abidjan — Cocody"></div>
    <div class="fld"><label>Téléphone</label><input id="a_tel" value="${esc(a.tel)}" placeholder="07 ..."></div>
  </div></div>
  <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="saveAgency('${id||''}')">${svg('check')} ${id?'Enregistrer':'Créer'}</button></div>`);
};
window.saveAgency=async function(id){
  const g=x=>document.getElementById(x).value.trim();
  if(!g('a_name')){ toast('Nom requis','err'); return; }
  const data={name:g('a_name'),ville:g('a_ville'),tel:g('a_tel')};
  try{
    if(id){ const a=await API.put('/agencies/'+id,data); replaceIn(DB.agencies,a); toast('Agence mise à jour','good'); }
    else{ const a=await API.post('/agencies',data); DB.agencies.push(a); toast('Agence créée','good'); }
    closeModal(); renderTopbar(); renderParametres();
  }catch(e){ toast(e.message,'err'); }
};

/* ============ Boot ============ */
(async function init(){
  if(API.token){
    try{ await bootstrapAndStart(); return; }
    catch(e){ /* token invalide/expiré */ }
  }
  showLogin();
})();

</script>
</body>
</html>
